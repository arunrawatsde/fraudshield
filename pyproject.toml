[project]
name = "fraudshield"
version = "0.1.0"
description = "Upload card transactions, flag suspicious ones with ML, and have an LLM agent investigate them"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["fraudshield"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
