name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m fraudshield.data_gen && python -m fraudshield.model
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  eval:
    # Runs the agent on a small labelled set and fails if F1 drops below 0.8.
    # Only on pushes to main, and only when the OPENAI_API_KEY repo secret exists.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m fraudshield.data_gen && python -m fraudshield.model
      - name: eval
        if: env.OPENAI_API_KEY != ''
        run: python -m evals.run_eval --limit 12 --min-f1 0.8
